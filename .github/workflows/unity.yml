name: Unity

# Has real Unity import what the connector exports and paint with its Rule Tile:
# unity/Assets/Editor/Tests/ExportTests.cs. Unity needs a licence to run, so this skips
# itself until the repo has one in its secrets; unity/README.md says how to add it.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  pull_request:
    paths:
      - ".github/workflows/unity.yml"
      - "aseprite_claude_connector/tiles.py"
      - "aseprite_claude_connector/tools/tiles.py"
      - "aseprite_claude_connector/tools/unity_export.py"
      - "scripts/make_unity_fixtures.py"
      - "unity/**"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Skip without a Unity licence
        if: env.UNITY_LICENSE == ''
        run: echo "::notice::No Unity licence in the repo secrets, so Unity didn't run. See unity/README.md."
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
      - uses: actions/setup-python@v7
        if: env.UNITY_LICENSE != ''
        with:
          python-version: "3.13"
      - name: Make the exports to import
        if: env.UNITY_LICENSE != ''
        run: |
          python -m pip install .
          python scripts/make_unity_fixtures.py unity/Assets/Sprites
      - name: Unity imports them and paints the Rule Tile
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: unity
          unityVersion: 2022.3.76f1
          testMode: editmode
