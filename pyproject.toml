[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aseprite-claude-connector"
version = "0.2.0"
description = "Unity-first MCP server for the live Aseprite editor (and headless batch)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyle Ocheltree", email = "hello@oaktree-games.com" }]
keywords = ["aseprite", "mcp", "pixel-art", "unity", "gamedev", "model-context-protocol"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
  # >=1.19: first SDK line where a tool can return CallToolResult, which preview
  # pictures need to keep structured output alongside an image. <2: the 2.x SDK removed
  # mcp.server.fastmcp (renamed to MCPServer), so the server can't import on it.
  "mcp>=1.19.0,<2",
  # Imported directly by tools/_schemas.py (pydantic requires the
  # typing_extensions TypedDict on Python < 3.12).
  "typing-extensions>=4.9.0",
  # The relay runs inside the server, so the live backend works out of the box.
  "websockets>=12",
]

[project.urls]
Homepage = "https://github.com/UmarMuhammad18/aseprite-claude-connector"
Repository = "https://github.com/UmarMuhammad18/aseprite-claude-connector"
Issues = "https://github.com/UmarMuhammad18/aseprite-claude-connector/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aseprite-claude-connector = "aseprite_claude_connector.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aseprite_claude_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F/W core · I import order · UP modernize · B bugbear. The Lua-in-Python
# string templates make long lines routine inside tool modules; E501 stays on,
# with the templates exempt below.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tool modules embed Lua templates where wrapping hurts readability; the relay
# and demo scripts predate the lint config and read fine as-is.
"aseprite_claude_connector/tools/*.py" = ["E501"]
"tests/*" = ["E501"]
"examples/*" = ["E501"]
