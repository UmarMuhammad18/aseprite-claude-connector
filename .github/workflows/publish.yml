name: Publish to PyPI

# Publishes the package to PyPI via Trusted Publishing (OIDC) — no API token is
# stored anywhere. PyPI must have a matching publisher configured under the project's
# Publishing settings:
#   Owner:       oaktreegames
#   Repository:  aseprite-live-mcp
#   Workflow:    publish.yml
#   Environment: (none)
#
# Trigger it either by clicking "Run workflow" in the Actions tab (workflow_dispatch),
# or by pushing a version tag like v0.1.0.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # REQUIRED for Trusted Publishing (OIDC); do not remove
      contents: read   # REQUIRED so actions/checkout can clone the repo
                       # (declaring `permissions` sets every unlisted scope to none)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
