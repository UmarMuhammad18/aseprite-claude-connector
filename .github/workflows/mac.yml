name: Mac

# The full check on a real Mac: compile Aseprite, then run setup and every tool against
# it. Compiling takes a while, so this runs when something Mac-sensitive changes, once a
# week, and on demand. Aseprite's licence lets you compile it for your own use, so the
# binary stays on the runner: it's never uploaded or cached.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: ["main"]
    paths: &mac_paths
      - ".github/workflows/mac.yml"
      - "aseprite_claude_connector/config.py"
      - "aseprite_claude_connector/setup.py"
      - "aseprite_claude_connector/extension/**"
      - "aseprite_claude_connector/tools/game_export.py"
      - "aseprite_claude_connector/tools/godot_export.py"
      - "aseprite_claude_connector/tiles.py"
      - "aseprite_claude_connector/tools/tiles.py"
      - "scripts/check_mac.py"
      - "scripts/check_godot.py"
      - "scripts/godot_check.gd"
  pull_request:
    paths: *mac_paths

env:
  ASEPRITE_TAG: v1.3.17.2
  GODOT_TAG: 4.4.1-stable

jobs:
  aseprite:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon jobs can sit unassigned until GitHub cancels them, which fails
        # the run, so pushes and PRs wait only for Intel. The weekly and on-demand
        # runs add Apple Silicon.
        os: ${{ fromJSON(contains(fromJSON('["push", "pull_request"]'), github.event_name) && '["macos-15-intel"]' || '["macos-15-intel", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: brew install ninja cmake || true
      - name: Compile Aseprite
        run: |
          git clone --recursive --depth 1 --shallow-submodules --branch "$ASEPRITE_TAG" \
            https://github.com/aseprite/aseprite.git "$RUNNER_TEMP/aseprite"
          cd "$RUNNER_TEMP/aseprite"
          ./build.sh --auto --norun
          echo "ASEPRITE_PATH=$RUNNER_TEMP/aseprite/build/bin/aseprite" >> "$GITHUB_ENV"
      - name: Install this package
        run: python -m pip install ".[dev]"
      - name: Setup lands where real Aseprite looks
        run: python scripts/check_mac.py
      - name: Every tool against real Aseprite
        env:
          ASEPRITE_MCP_BACKEND: headless
          ASEPRITE_MCP_NO_UPDATE_CHECK: "1"
        run: python tests/smoke_headless.py
      - name: A real export loads in real Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip"             "https://github.com/godotengine/godot/releases/download/$GODOT_TAG/Godot_v${GODOT_TAG}_macos.universal.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_PATH="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" python scripts/check_godot.py
